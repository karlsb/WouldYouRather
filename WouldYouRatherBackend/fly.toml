app = "wouldyourather-api"
primary_region = "arn"

[build]

[env]
  ENV = "production"
  LOG_LEVEL = "PROD"
  DB_PATH = "/data/wouldyourather.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "wyr_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
